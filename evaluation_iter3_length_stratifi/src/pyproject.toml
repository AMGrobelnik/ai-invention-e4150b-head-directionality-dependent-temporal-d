[project]
name = "eval-id4-it3"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pandas==3.0.1",
    "numpy==2.4.3",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "scikit-learn==1.8.0",
    "loguru==0.7.3",
    "psutil==7.2.2",
    "joblib==1.5.3",
    "patsy==1.0.2",
    "threadpoolctl==3.6.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends._legacy:_Backend"
